
<!DOCTYPE html>
<html lang="ru" data-theme="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мой блог</title>
  <link href="./style.css" rel="stylesheet">
  <script>
    // Apply saved theme before paint to avoid a flash of the wrong theme.
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        if (saved) document.documentElement.setAttribute('data-theme', saved);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="./index.html">
        <span class="brand__mark">Б</span>
        Мой блог
      </a>
      <div class="nav-actions">
        <button class="theme-toggle" id="theme-toggle" type="button" title="Переключить тему" aria-label="Переключить тему">
          <span id="theme-icon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <div class="page">
    <div id="content">
      <section class="hero">
  <span class="eyebrow">✦ Последние записи</span>
  <h1>Мой блог</h1>
  <p>Здесь я пишу о том, что мне интересно — коротко, по делу, без воды.</p>
</section>

<div class="card empty-state">
  <p>Пока нет опубликованных записей.</p>
</div>
    </div>
    <aside id="sidebar">
      <div class="card sidebar-card">
        <span class="sidebar-badge">✦ О блоге</span>
        <h2>Мой блог</h2>
        <p>Заметки, статьи и мысли — обновляется регулярно.</p>
      </div>
    </aside>
  </div>

  <footer class="site-footer">
    © 2026 Мой блог. Сделано на Django.
  </footer>

  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      var icon = document.getElementById('theme-icon');
      var root = document.documentElement;

      function currentTheme() {
        var attr = root.getAttribute('data-theme');
        if (attr === 'dark' || attr === 'light') return attr;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      function syncIcon() {
        icon.textContent = currentTheme() === 'dark' ? '☀️' : '🌙';
      }

      btn.addEventListener('click', function () {
        var next = currentTheme() === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        syncIcon();
      });

      syncIcon();
    })();
  </script>
</body>
</html>
