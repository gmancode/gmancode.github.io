ru:
  site_desc: "Небольшие инструменты с открытым кодом и заметки о том, как они сделаны."
  nav_projects: "Проекты"
  nav_blog: "Блог"
  nav_about: "Обо мне"
  nav_contact: "Контакты"
  hero_title: "Небольшие <span class=\"accent\">инструменты</span> и заметки о том, как они сделаны"
  hero_text: "Пишу маленькие программы на Rust и Python, выкладываю их с открытым кодом и коротко рассказываю, как всё устроено."
  btn_projects: "Смотреть проекты"
  btn_github: "GitHub →"
  sec_projects: "Проекты"
  sec_projects_tag: "open source"
  airhome_desc: "Звук Windows на HomePod в один клик. Небольшая программа в трее: перехватывает системный звук и отправляет его на колонки AirPlay 2, умеет играть сразу на нескольких."
  link_src: "Исходники →"
  link_dl: "Скачать установщик →"
  stat_1_v: "GPL-3.0"
  stat_1_l: "открытый код"
  stat_2_v: "8"
  stat_2_l: "языков интерфейса"
  stat_3_v: "12 МБ"
  stat_3_l: "одна небольшая программа"
  stat_4_v: "0"
  stat_4_l: "телеметрии, рекламы, аккаунтов"
  sec_features: "Что умеет airhome"
  sec_features_tag: "возможности"
  feats:
    - t: "Один клик, без драйверов"
      d: "Никаких виртуальных звуковых карт, Bonjour и iTunes. Выберите колонку и нажмите «Подключиться»."
    - t: "Звук только там, где нужно"
      d: "Колонки компьютера выключаются на время трансляции и потом включаются обратно, даже если программа закрылась аварийно."
    - t: "Несколько колонок синхронно"
      d: "Нажмите + у других колонок, и они заиграют вместе, у каждой своя громкость (экспериментально)."
    - t: "Живёт в трее"
      d: "Подключение, отключение и громкость доступны из меню в трее, окно открывать не нужно."
    - t: "Не теряет связь"
      d: "Автоматическое переподключение, повтор при медленном старте, кнопка отмены и уведомление, если что-то пошло не так."
    - t: "Маленькая и приватная"
      d: "Один файл, без аккаунта, телеметрии и проверок обновлений. Говорит на 8 языках."
  sec_shots: "Как это выглядит"
  sec_shots_tag: "скриншоты"
