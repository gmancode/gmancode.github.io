  sec_features_tag: "features"
  feats:
    - t: "One click, no drivers"
      d: "No virtual sound card, no Bonjour, no iTunes. Pick a speaker and press connect."
    - t: "Sound only where you want it"
      d: "The PC's own speakers are muted while streaming and restored afterwards, even after a crash."
    - t: "Several speakers in sync"
      d: "Tap + next to more speakers to play on all of them, each with its own volume (experimental)."
    - t: "Lives in the tray"
      d: "Connect, disconnect and change the volume from the tray menu without opening the window."
    - t: "Stays connected"
      d: "Automatic reconnect, a retry on a slow start, a cancel button and a notification if something fails."
    - t: "Small and private"
      d: "One file, no account, no telemetry, no update pings. Speaks 8 languages."
