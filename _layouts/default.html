<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#0e0d0c">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/svg+xml" href="{{ "/assets/favicon.svg" | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/style.css" | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ "/" | relative_url }}"><span class="brand__dot"></span>{{ site.title }}</a>
      <nav class="nav" aria-label="Разделы">
        <a href="{{ "/" | relative_url }}#projects">Проекты</a>
        <a href="{{ "/" | relative_url }}#blog">Блог</a>
        <a href="{{ "/" | relative_url }}#contact">Контакты</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© {{ site.time | date: "%Y" }} {{ site.title }}</span>
      <span>Сделано на Jekyll · хостинг GitHub Pages</span>
    </div>
  </footer>
</body>
</html>
